<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Chronicle PC tracker</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 320px; color: #222; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; font: inherit; }
    button { margin-top: 14px; padding: 6px 14px; font: inherit; cursor: pointer; }
    #etat { margin-top: 12px; white-space: pre-wrap; }
    .ok { color: #1a7f37; } .ko { color: #b42318; }
    p.aide { color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Chronicle PC tracker</h3>
  <p class="aide">Le jeton est affiche par <code>python -m pc.tracker init</code>, et se trouve dans
    <code>config.toml</code>, section <code>[browser]</code>.</p>
  <label for="port">Port du tracker</label>
  <input id="port" type="number" min="1024" max="65535" value="8781">
  <label for="token">Jeton</label>
  <input id="token" type="password" autocomplete="off">
  <button id="enregistrer">Enregistrer et tester</button>
  <div id="etat"></div>
  <script src="options.js"></script>
</body>
</html>
